---
- name: Deploy OpenStack Networks from centralized variables
  hosts: localhost
  serial: 1
  gather_facts: false

  module_defaults:
    group/openstack.cloud.openstack:
      cloud: default

  tasks:
    # --- Task 1: Handle EXTERNE (The special network that requires specific provider parameters) ---
    - name: Create EXTERNE network
      openstack.cloud.network:
        project: "{{ networks[0].project_name_ext }}"
        state: present
        name: "{{ networks[0].name_ext }}"
        dns_domain: "{{ networks[0].dns_domain_ext }}"
        external: true
        shared: true
        provider_network_type: "{{ networks[0].provider_network_type_ext }}"
        provider_physical_network: "{{ networks[0].provider_physical_network_ext }}"
        provider_segmentation_id: "{{ networks[0].provider_segmentation_id_ext }}"

    - name: Create EXTERNE subnet (Base for all routers)
      openstack.cloud.subnet:
        project: "{{ networks[0].project_name_ext }}"
        state: present
        name: externe
        network_name: "{{ networks[0].name_ext }}"
        cidr: "{{ networks[0].cidr_ext }}"
        dns_nameservers:
          - "{{ networks[0].dns_servers_ext }}"
        extra_attrs:
          dns_publish_fixed_ip: true
      register: externe_subnet

    # --- Task 2: Loop through all other defined application and lab networks (ntier, status, billing, etc.) ---
    - name: Configure Network Components for {{ item.name }} (Network, Subnet, Router)
      block:
        - name: Create {{ item.name }} network
          openstack.cloud.network:
            project: "{{ item.project_name }}"
            state: present
            name: "{{ item.name }}"
            dns_domain: "{{ item.dns_domain }}"
            shared: false
            provider_network_type: "{{ item.provider_network_type }}"

        - name: Create {{ item.name }} subnet
          openstack.cloud.subnet:
            project: "{{ item.project_name }}"
            state: present
            # Subnet name is derived from the network name, simplified for robustness
            name: "{{ item.name | replace('_ext', '') }}"
            network_name: "{{ item.name }}"
            cidr: "{{ item.cidr }}"
            dns_nameservers:
              - "{{ item.dns_servers }}"
            extra_attrs:
              dns_publish_fixed_ip: true

        - name: Create {{ item.router_name }} router
          openstack.cloud.router:
            project: "{{ item.project_name }}"
            name: "{{ item.router_name }}"
            network: EXTERNE
            interfaces:
            # Interface name is simply the network name
              - "{{ item.name }}"
            enable_snat: true
            external_fixed_ips:
              - subnet_id: "{{ externe_subnet.id }}"
            ip_address: "{{ item.external_ip }}"
            state: present

      loop: "{{ networks | selectattr('name_ext', 'undefined') }}"
