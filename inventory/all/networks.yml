---
# inventory/all/networks.yml
---
global_vars:
  external_project: admin
  default_dns_domain: opn.lab.
  provider_vlan_network: provider-vlan
  provider_segmentation_id: 5
  dns_servers:
    main: "192.168.133.249"
    external: "192.168.133.251"

# Network definitions list (Network, Subnet, Router)
networks:
  # MARK: EXTERNE - The external backbone network
  - name_ext: EXTERNE
    project_name_ext: admin
    dns_domain_ext: opn.lab.
    provider_network_type_ext: vlan
    provider_physical_network_ext: provider-vlan
    provider_segmentation_id_ext: 5
    cidr_ext: 192.168.135.0/24
    dns_servers_ext: "{{ global_vars.dns_servers.external }}"
  
  # MARK: NTIER - Application tier network
  - name_ntier: NTIER
    project_name_ntier: app-ntier
    dns_domain_ntier: ntier.opn.lab.
    provider_network_type_ntier: geneve
    cidr_ntier: 192.168.23.0/24
    dns_servers_ntier: "{{ global_vars.dns_servers.main }}"
    router_name_ntier: NTIER-GW
    external_ip_ntier: 192.168.135.23
  
  # MARK: STATUS - Status monitoring network
  - name_status: STATUS
    project_name_status: app-status
    dns_domain_status: status.opn.lab.
    provider_network_type_status: geneve
    cidr_status: 192.168.22.0/24
    dns_servers_status: "{{ global_vars.dns_servers.main }}"
    router_name_status: STATUS-GW
    external_ip_status: 192.168.135.22
  
  # MARK: BILLING - Billing network
  - name_billing: BILLING
    project_name_billing: app-billing
    dns_domain_billing: billing.opn.lab.
    provider_network_type_billing: geneve
    cidr_billing: 192.168.21.0/24
    dns_servers_billing: "{{ global_vars.dns_servers.main }}"
    router_name_billing: BILLING-GW
    external_ip_billing: 192.168.135.21
  
  # MARK: FOREMAN - Foreman server network
  - name_foreman: FOREMAN
    project_name_foreman: app-foreman
    dns_domain_foreman: foreman.opn.lab.
    provider_network_type_foreman: geneve
    cidr_foreman: 192.168.20.0/24
    dns_servers_foreman: "{{ global_vars.dns_servers.main }}"
    router_name_foreman: FOREMAN-GW
    external_ip_foreman: 192.168.135.20
  
  # MARK: MONITORING - Monitoring stack network
  - name_monitoring: MONITORING
    project_name_monitoring: app-monitoring
    dns_domain_monitoring: monitoring.opn.lab.
    provider_network_type_monitoring: geneve
    cidr_monitoring: 192.168.19.0/24
    dns_servers_monitoring: "{{ global_vars.dns_servers.main }}"
    router_name_monitoring: MONITORING-GW
    external_ip_monitoring: 192.168.135.19
  
  # MARK: LAB Networks (LAB1 through LAB8) - Explicit List
